<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <title>Pirafu2411 Playground ロビー試作</title>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="tags" aria-hidden="true"></div>
  <div class="ui" id="ui">
    <header class="bar">
      <h1 class="bar-brand"><span class="mark" id="mark"></span><span class="bar-name" lang="en">Pirafu2411 Playground</span><span class="bar-sub" lang="en">Creative Lobby</span></h1>
      <div class="bar-env">
        <time class="bar-date" id="barDate"></time>
        <time class="bar-time" id="barTime"></time>
        <span class="bar-sky" id="barSky"></span>
      </div>
    </header>
    <main class="lobby" id="lobby">
      <section class="featured" id="featured" aria-labelledby="featuredTitle"></section>
      <section class="updates" id="updates" aria-labelledby="updatesTitle"></section>
    </main>
    <section class="sheet" id="sheet" aria-labelledby="sheetTitle" hidden></section>
    <p class="space-note" id="spaceNote" role="status" hidden></p>
    <nav class="dock" id="dock" aria-label="ロビーのメニュー"></nav>
  </div>
  <button class="restore" id="restore" type="button" hidden>UIを表示</button>
  <noscript><p class="noscript">このページを表示するにはJavaScriptが必要です。</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
