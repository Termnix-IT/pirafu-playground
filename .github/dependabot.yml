version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # Workflows pin actions to commit SHAs; Dependabot keeps the SHA and the
  # trailing version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
